<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
            html, body {
                background-color: #ffffff;
            }
            .ol-control > * {
                background-color: #f8f8f8!important;
                color: #444444!important;
                border-radius: 0px;
            }
            .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
                color: #444444!important;
            }
            .search-layer-input-search {
                background-color: #f8f8f8!important;
            }
            .ol-control > *:focus, .ol-control >*:hover {
                background-color: rgba(248, 248, 248, 0.7)!important;
            } 
            .ol-control {
                background-color: rgba(255,255,255,.4) !important;
                padding: 2px !important;
            } 
        </style>

        <style>

            html,body{
            
            margin:0;
            padding:0;
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            
            }
            
            #map{
            
            width:100%;
            height:75vh;
            
            }
            
            #info{
            
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:20px;
            
            padding:20px;
            
            background:white;
            
            }
            
            .panel{
            
            padding:20px;
            
            border-radius:10px;
            
            box-shadow:0 2px 8px rgba(0,0,0,.15);
            
            }
            
            input,
            textarea{
            
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:10px;
            
            }
            
            button{
            
            padding:10px;
            width:100%;
            
            }
            
            @media(max-width:800px){
            
            #info{
            
            grid-template-columns:1fr;
            
            }
            
            }

            #filters{
            display:flex;
            gap:20px;
            padding:10px;
            background:white;
            justify-content:center;
            align-items:center;
            box-shadow:0 2px 6px rgba(0,0,0,0.1);
            }
            
            #filters label{
                font-size:14px;
            }
            
            #filters select{
                margin-left:10px;
                padding:5px;
            }
        
        </style>
        <title></title>
    </head>
    <body>
        <div id="filters">

            <label>
                Visitor Centre:
                <select id="visitorFilter">
                    <option value="all">All</option>
                    <option value="yes">With Visitor Centre</option>
                    <option value="no">No Visitor Centre</option>
                </select>
            </label>
        
            <label>
                Toilets:
                <select id="Toilets">
                    <option value="all">All</option>
                    <option value="yes">With Car Park</option>
                    <option value="no">No Car Park</option>
                </select>
            </label>
        
        </div>
        
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
     

        <div id="info">

            <div class="panel">
            
                <h2>Nature reserves across the UK</h2>
                
                <p>
                
                This map shows nature reserves or areas of interest for nature enthusiasts across the UK. 
                
                </p>
            
            </div>
            
            <div class="panel">
            
                <h2>Advertisement</h2>
                
                <div id="advert">
                
                    Advertisement goes here
                
                </div>
            
            </div>

        <div class="panel">
        
            <h2>Contact Me</h2>
        
            <form action="https://formspree.io/f/YOURFORMID"
            method="POST">
            
            <input
            type="text"
            name="name"
            placeholder="Name"
            required>
            
            <input
            type="email"
            name="email"
            placeholder="Email"
            required>
            
            <textarea
            name="message"
            placeholder="Message"
            required></textarea>
            
            <button>
            
            Send
            
            </button>
            
            </form>
        
        </div>
        
    </div>
        
    <hr>

    <div class="panel">

        <h2>☕ Support this project</h2>
        
        <p>
        If you find this map useful, you can support it here:
        </p>
        
        <a href="https://www.buymeacoffee.com/YOURNAME" target="_blank">
            <button>
                Buy Me a Coffee
            </button>
        </a>
        
    </div>




        
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/NaturesReserves_2.js"></script>
        <script src="styles/NaturesReserves_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>   

        <script>
            let visitorFilter = "all";
            let toiletFilter = "all";
            
            // wait for map/layers to load
            setTimeout(() => {
            
                const visitorSelect = document.getElementById("visitorFilter");
                const toiletSelect = document.getElementById("toiletFilter");
            
                visitorSelect.addEventListener("change", function() {
                    visitorFilter = this.value;
                    applyFilters();
                });
            
                carSelect.addEventListener("change", function() {
                    toiletFilter = this.value;
                    applyFilters();
                });
            
            }, 1000);
            
            
            // CORE FILTER FUNCTION
            function applyFilters() {
            
                // THIS depends on your layer variable name:
                // qgis2web usually creates: layer_NaturesReserves_2
            
                const layer = layer_NaturesReserves_2;
            
                layer.getSource().changed();
            
                layer.setStyle(function(feature) {
            
                    const hasVisitor = feature.get("VisitorCen");
                    const hasCar = feature.get("Toilets");
            
                    // normalize values
                    const v = String(hasVisitor).toLowerCase();
                    const c = String(hasCar).toLowerCase();
            
                    // FILTER LOGIC
            
                    if (visitorFilter !== "all") {
                        if (visitorFilter === "yes" && v !== "yes" && v !== "true" && v !== "1") {
                            return null;
                        }
                        if (visitorFilter === "no" && (v === "yes" || v === "true" || v === "1")) {
                            return null;
                        }
                    }
            
                    if (toiletFilter !== "all") {
                        if (toiletFilter === "yes" && c !== "yes" && c !== "true" && c !== "1") {
                            return null;
                        }
                        if (toiletFilter === "no" && (c === "yes" || c === "true" || c === "1")) {
                            return null;
                        }
                    }
            
                    // return default style from qgis2web
                    return feature.getStyle ? feature.getStyle() : undefined;
                });
            
            }
        </script>
        
    </body>
</html>
